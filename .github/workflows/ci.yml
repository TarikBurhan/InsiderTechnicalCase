name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        # The provider (webhook.site) url is a secret: Settings > Secrets and
        # variables > Actions > New repository secret, name PROVIDER_URL.
        env:
          PROVIDER_URL: ${{ secrets.PROVIDER_URL }}
        run: |
          cp .env.example .env
          if [ -n "$PROVIDER_URL" ]; then
            sed -i "s|^PROVIDER_URL=.*|PROVIDER_URL=${PROVIDER_URL}|" .env
            echo "PROVIDER_URL taken from repository secret"
          else
            echo "::warning::PROVIDER_URL secret is not set; deliveries will fail against the placeholder url"
          fi
      - name: Start stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:8080/ready && exit 0; sleep 5; done
          exit 1
      - name: End-to-end smoke test
        run: ./scripts/e2e.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
