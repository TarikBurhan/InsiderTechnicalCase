global:
  scrape_interval: 10s

scrape_configs:
  - job_name: panel
    static_configs:
      - targets: ["panel:8080"]
  - job_name: manager
    static_configs:
      - targets: ["manager:8081"]
  - job_name: customizer
    static_configs:
      - targets: ["customizer:8082"]
  # DNS service discovery so every sender replica is scraped.
  - job_name: smssender
    dns_sd_configs:
      - names: ["smssender"]
        type: A
        port: 8083
  - job_name: emailsender
    dns_sd_configs:
      - names: ["emailsender"]
        type: A
        port: 8084
  - job_name: pushsender
    dns_sd_configs:
      - names: ["pushsender"]
        type: A
        port: 8085
